name: Telegram 分析清單

on:
  # 每 30 分鐘檢查一次 Telegram 指令（避開整點/半點，比較不會被 GitHub 跳過）
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tg-watchlist
  cancel-in-progress: false

jobs:
  watchlist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v5

      - name: 處理 Telegram 指令
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tg_watchlist.py

      - name: 儲存變更
        run: |
          if [ -n "$(git status --porcelain stock_list.txt .tg_offset)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stock_list.txt .tg_offset
            git commit -m "Telegram 更新分析清單 [skip ci]"
            git pull --rebase
            git push
          else
            echo "沒有變更"
          fi
